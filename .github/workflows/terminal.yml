name: "Terminal Initializer"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate-terminal-svg:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Generate Native Terminal SVG
        run: |
          mkdir -p dist
          cat << 'EOF' > dist/terminal.svg
          <svg fill="none" viewBox="0 0 700 230" width="100%" xmlns="http://www.w3.org/2000/svg">
            <style>
              .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 8px; }
              .prompt { fill: #8b949e; font-family: monospace; font-size: 13px; }
              .cmd { fill: #3fb950; font-family: monospace; font-size: 13px; font-weight: bold; }
              .line { fill: #8b949e; font-family: monospace; font-size: 13px; }
              .header { fill: #d2a8ff; font-family: monospace; font-size: 13px; font-weight: bold; }
              .text { fill: #58a6ff; font-family: monospace; font-size: 13px; }
              .success { fill: #3fb950; font-family: monospace; font-size: 13px; font-weight: bold; }
            </style>
            
            <rect width="698" height="228" x="1" y="1" class="bg" />
            
            <text x="20" y="35"><tspan class="prompt">lahadiyani@core:~$</tspan> <tspan class="cmd">./init_system.sh --target github.com/lahadiyani</tspan></text>
            <text x="20" y="55" class="line">============================================================</text>
            <text x="20" y="75" class="header">[!] INITIALIZING SYSTEM CORE ENVIRONMENT...</text>
            <text x="20" y="95" class="text">[*] Booting AI Core Module &amp; Security Engine...</text>
            <text x="20" y="115" class="text">[*] Syncing Metrics &amp; Deploying Workflows...</text>
            <text x="20" y="135" class="line">------------------------------------------------------------</text>
            <text x="20" y="155"><tspan class="text">[+] STATUS      : </tspan><tspan class="cmd">ONLINE / ACTIVE</tspan></text>
            <text x="20" y="175" class="text">[+] ENVIRONMENT : X86_64 / UBUNTU_CONTAINER</text>
            <text x="20" y="195" class="line">------------------------------------------------------------</text>
            <text x="20" y="215" class="success">&gt;&gt;&gt; [SUCCESS] :: HELLO WORLD FROM GITHUB ACTIONS! :: &lt;&lt;&lt;</text>
          </svg>
          EOF

      - name: Push terminal.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
